name: Build and Release
on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with 'v' (e.g., v1.0.0)

jobs:
  build:
    name: Build and Upload .deb Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch all git tags for 'git describe'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # Standard Go version

      - name: Make scripts executable
        run: chmod +x build-deb.sh

      - name: Build amd64 (Intel/AMD) Debian Package
        run: ./build-deb.sh amd64

      - name: Build arm64 (Raspberry Pi/ARM) Debian Package
        run: ./build-deb.sh arm64

      - name: Extract Tag Name
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.deb
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
